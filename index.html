<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="HandheldFriendly" content="true" />
    <title>Chakra Survivor</title>
    <!-- Yandex Games SDK.
         ВАЖНО: при FORCE_MOCK=true в src/systems/YandexSDK.ts этот скрипт
         НЕ используется (игра не вызывает YaGames.init), но мы даже не
         загружаем его локально — иначе спамит "No parent to post message".
         Загружаем динамически только если страница открыта НЕ как localhost. -->
    <script>
      (function () {
        var h = location.hostname;
        var local = h === 'localhost' || h === '127.0.0.1' || h === '' || /^19\./.test(h) || /^10\./.test(h);
        if (!local) {
          var s = document.createElement('script');
          s.src = 'https://yandex.ru/games/sdk/v2';
          document.head.appendChild(s);
          window.__YA_SDK_LOADED__ = true;
        } else {
          console.log('%c[YA] localhost: Yandex SDK script skipped (mock mode)', 'color:#888');
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060d;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #game-container {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
